<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Velvet Viking Strength</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* LAYOUT: one phone-width column in Valhalla's dark identity. Anything you
   flip through -- exercises, days, weeks, logged sessions -- is a CAROUSEL
   like an Instagram post: a full-width square picture, one at a time, with
   dots underneath saying there is more. Swipe to move. What the showing slide
   holds opens underneath it.

   TOKENS are Valhalla's own (velvet-viking-valhalla-2, protected/
   velvet-viking-valhalla.html :root), character for character.

   COPIED FROM VALHALLA, NOT APPROXIMATED:
     .th-hero   the Today hero: no card, lit title + lit metric left, ring right
     .th-ring   the near-complete cherry ring, its gradient, draw-on and pulse
     .ws-h-step the 2km/6km/1km tiles, used for Focus / Feel / Watch for
     view pager swipe sideways anywhere to move between the five screens
     .btn-race  the race-day edge: 1.5px cherry rim, cherry wash, glow
   ACCENT RULES carried over: gold is the brand; cherry is the button that
   moves you forward and progression. SCREEN JOBS carried over: Today = DO,
   This Week = MANAGE, Program = PLAN, Training = UNDERSTAND, Settings =
   CONFIGURE. */
:root{
  color-scheme:dark;
  --bg:#121316; --bg-2:#1B1A1E; --bg-3:#1C1E24; --bg-4:#26252A;
  --ink:#F4F1EA; --ink-dim:#BBB4A4; --ink-faint:#9D9787;
  --line:#302E36; --line-soft:#232126;
  --bronze:#C0923F; --gold:#E3B15A; --gold-text:#E3B15A; --gold-bright:#F5D061; --gold-deep:#8A6D2B;
  --cherry:#9A546C; --cherry-fill:#7A2E42; --cherry-text:#C46A89; --cherry-dim:rgba(154,84,108,0.50);
  --cherry-tint:rgba(154,84,108,.16); --cherry-line:rgba(154,84,108,.45);
  --c-easy:#84A56E; --c-tempo:#CC9245; --c-threshold:#B5505A; --c-long:#5E93AC;
  --t-card:#1C1E24; --t-tile:rgba(20,22,27,.8); --t-tile-rim:rgba(255,255,255,.08);
  --radius-sm:10px; --radius:16px; --tile-radius:20px;
  --fs-support:.84375rem;
  --ring-draw:1140ms;
  --display-face:'Cinzel', 'Times New Roman', serif;
  --text-face:'Oswald', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  --mono-face:'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
*{box-sizing:border-box;}
html,body{background:var(--bg);}
body{margin:0; color:var(--ink); font-family:var(--text-face); font-size:16px; line-height:1.4;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; overflow-x:hidden;}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer;}
button:focus-visible, input:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
svg.i{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2.1; stroke-linecap:round; stroke-linejoin:round; flex:none;}

.app{max-width:480px; margin:0 auto; touch-action:pan-y;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:18px calc(96px + env(safe-area-inset-bottom, 0px));}
.app.resting{padding-bottom:calc(196px + env(safe-area-inset-bottom, 0px));}

/* ---------- WORDMARK ---------- */
.brand{display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:20px;}
.wordmark{font-family:var(--display-face); font-weight:800; font-size:clamp(26px, 8vw, 34px); letter-spacing:.06em; line-height:1;
  background:linear-gradient(180deg, var(--gold-bright) 0%, var(--bronze) 55%, var(--gold-deep) 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;}
.brand .rule{width:150px; height:1px; background:linear-gradient(90deg, transparent, var(--bronze), transparent);}

/* ---------- SCREEN HEAD (every screen but Today) ---------- */
.screen-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:18px;}
.screen-title{font-weight:600; font-size:30px; letter-spacing:.02em; line-height:1; text-transform:uppercase;}
.screen-sub{color:var(--ink-dim); font-size:17px; margin-top:6px;}
.chip{display:inline-flex; align-items:center; gap:6px; white-space:nowrap; border:1px solid var(--line); border-radius:999px;
  padding:6px 12px; font-size:13px; color:var(--ink-dim); background:var(--bg-2);}
.chip svg.i{width:14px; height:14px; color:var(--gold);}

/* ---------- THE HERO (Valhalla .th-hero) ---------- */
.th-hero{display:flex; align-items:center; gap:9px; flex-wrap:nowrap; padding:4px 2px 10px; margin:0;}
.th-hero-main{flex:1 1 56%; min-width:0; display:flex; flex-direction:column; justify-content:center; gap:2px; padding:2px 6px 2px 2px;}
.th-hero-title{display:block; font-size:21.85px; font-weight:600; line-height:1.2; letter-spacing:.04em; text-transform:uppercase; color:#FFFFFF;
  text-shadow:0 0 1px rgba(255,255,255,.42), 0 0 13px rgba(255,255,255,.26), 0 0 34px rgba(255,255,255,.10);}
.th-dist{display:flex; align-items:baseline; gap:3px;}
.th-dist span{font-family:var(--text-face); font-weight:700; line-height:1; font-size:clamp(45.6px, 14.4vw, 57.6px); letter-spacing:-0.02em;
  font-variant-numeric:tabular-nums; color:#FFFFFF;
  text-shadow:0 0 1px rgba(255,255,255,.55), 0 0 20px rgba(255,255,255,.42), 0 0 54px rgba(255,255,255,.22);}
.th-dist em{font-style:normal; font-weight:700; font-size:clamp(28.8px, 9.6vw, 38.4px); color:#FFFFFF;
  text-shadow:0 0 1px rgba(255,255,255,.50), 0 0 18px rgba(255,255,255,.34);}
.th-phase{text-transform:uppercase; letter-spacing:.05em; font-size:12.5px; color:var(--gold-text); margin-top:4px;}
.th-ring-wrap{flex:0 0 40%; display:flex; align-items:center; justify-content:center;}
.th-ring{position:relative; flex:none; width:clamp(116px, 35vw, 144px); aspect-ratio:1/1; display:block;}
.th-arc{position:absolute; inset:0; width:100%; height:100%; overflow:visible;
  filter:drop-shadow(0 0 10px var(--cherry-dim)) drop-shadow(0 0 26px rgba(154,84,108,.30));
  animation:vv-glow-ring 3.6s ease-in-out 1.64s infinite;}
.th-arc path{stroke-dasharray:1; animation:th-draw var(--ring-draw) cubic-bezier(.22,.61,.36,1) both;}
@keyframes th-draw{from{stroke-dashoffset:1;} to{stroke-dashoffset:0;}}
@keyframes vv-glow-ring{
  0%,100%{filter:drop-shadow(0 0 10px rgba(154,84,108,.50)) drop-shadow(0 0 26px rgba(154,84,108,.30)) drop-shadow(0 0 40px rgba(154,84,108,0));}
  50%{filter:drop-shadow(0 0 10px rgba(154,84,108,1)) drop-shadow(0 0 26px rgba(154,84,108,.90)) drop-shadow(0 0 40px rgba(154,84,108,.78));}
}
.th-ring-in{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0; text-align:center; padding:0 9%;}
.th-row{display:flex; align-items:center; justify-content:center; gap:5px; color:var(--ink); white-space:nowrap; font-size:clamp(11px, 3vw, 13px); line-height:1.5;}
.th-row .th-ic{display:inline-flex; width:12px; height:12px; color:var(--gold-text);}
.th-row .th-ic svg{width:12px; height:12px;}
.th-row.mp{color:var(--gold-text); font-size:clamp(9px, 2.4vw, 10.5px); letter-spacing:.06em; text-transform:uppercase; font-family:var(--mono-face);}
.th-steps-note{display:block; margin:0; padding:0 2px 10px; color:var(--ink-faint); font-size:var(--fs-support); text-align:center; text-wrap:balance;}

/* ---------- THE COACHING TILES ----------
   Valhalla's session-structure tiles (.ws-h-step), the 2km / 6km / 1km row:
   three tiles side by side, quiet rim, and the one in focus lit with the
   cherry edge Valhalla gives the work step (.ws-h-step.ws-work). Tap a tile
   to move the focus. */
.tiles{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; align-items:stretch; margin-top:14px;}
.tile3{display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; min-width:0;
  padding:12px 8px 14px; border-radius:14px; background:var(--t-tile); border:1px solid var(--t-tile-rim);
  transition:border-color .2s, box-shadow .2s, background .2s;}
.tile3 .k{font-weight:600; font-size:17px; letter-spacing:.05em; text-transform:uppercase; color:#fff;
  text-shadow:0 0 1px rgba(255,255,255,.4), 0 0 12px rgba(255,255,255,.18);}
.tile3 .v{font-size:var(--fs-support); line-height:1.5; color:var(--ink-dim); overflow-wrap:break-word; hyphens:auto; -webkit-hyphens:auto;}
.tile3.is-active{border:1.5px solid var(--cherry); background:var(--cherry-tint), var(--t-tile);
  box-shadow:0 0 16px var(--cherry-dim), inset 0 0 18px var(--cherry-tint);}
.tile3.is-active .v{color:var(--ink);}
.dots{display:flex; justify-content:center; gap:7px; padding:12px 0 2px;}
.dots button{width:6px; height:6px; border-radius:50%; background:var(--ink-faint); opacity:.34; transition:opacity .25s ease, background-color .25s ease, box-shadow .25s ease; position:relative;}
.dots button::after{content:''; position:absolute; inset:-9px;}
.dots button.on{background:var(--gold-bright); opacity:1; box-shadow:0 0 8px rgba(245,208,97,.6);}

.section-head{display:flex; align-items:baseline; justify-content:space-between; margin:26px 2px 14px;}
.section-head h2{margin:0; font-size:20px; font-weight:600; letter-spacing:.03em; color:var(--gold); text-transform:uppercase;}
.section-head span{font-size:14px; letter-spacing:.04em; color:var(--ink-dim); text-transform:uppercase;}

/* ---------- THE CAROUSEL ----------
   Full width, edge to edge, square -- an Instagram post. One slide shows at
   a time; the dots underneath say there is more. Swipe to move. */
.deck{position:relative; overflow:hidden; touch-action:pan-y; user-select:none; -webkit-user-select:none;
  margin-left:calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right:calc(-1 * max(16px, env(safe-area-inset-right, 0px)));}
.deck-track{display:flex; transition:transform .38s cubic-bezier(.22,.61,.36,1); will-change:transform;}
.deck-track.dragging{transition:none;}
.wcard{position:relative; flex:0 0 100%; aspect-ratio:1/1; max-width:100%; overflow:hidden;
  --hue:var(--bronze);
  background:
    radial-gradient(80% 70% at 50% 38%, color-mix(in srgb, var(--hue) 40%, transparent) 0%, transparent 70%),
    linear-gradient(160deg, color-mix(in srgb, var(--hue) 30%, #121316) 0%, #15161b 60%, #0f1013 100%);}
.wcard.hue-0{--hue:var(--c-long);} .wcard.hue-1{--hue:var(--c-threshold);} .wcard.hue-2{--hue:var(--c-tempo);}
.wcard.hue-3{--hue:var(--c-easy);} .wcard.hue-4{--hue:var(--cherry);} .wcard.hue-rest{--hue:#5a5560;}
/* Legibility scrim: the words sit on the bottom of the picture. */
.wcard::after{content:''; position:absolute; left:0; right:0; bottom:0; height:52%; pointer-events:none; z-index:1;
  background:linear-gradient(180deg, rgba(10,10,12,0) 0%, rgba(10,10,12,.72) 55%, rgba(10,10,12,.94) 100%);}
.wcard.current{box-shadow:inset 0 0 0 2px var(--gold), inset 0 0 28px rgba(227,177,90,.25);}
.wcard .art{position:absolute; inset:0; width:100%; height:100%;}
.wcard .art.full{inset:0; top:0; height:100%;}
.wcard.complete .art{opacity:.45;}
.art .fig{fill:none; stroke:#FFFFFF; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; filter:drop-shadow(0 0 6px rgba(255,255,255,.35));}
.art .head{fill:#FFFFFF; stroke:none; filter:drop-shadow(0 0 6px rgba(255,255,255,.35));}
.art .eq{fill:none; stroke:var(--gold); stroke-width:4; stroke-linecap:round; stroke-linejoin:round;}
.art .eqf{fill:var(--gold); stroke:none; opacity:.95;}
.art .big{font-family:var(--display-face); font-weight:800; fill:rgba(255,255,255,.9); filter:drop-shadow(0 0 10px rgba(255,255,255,.3));}
.art .photo{display:block; width:100%; height:100%; object-fit:cover; filter:brightness(.78) saturate(.92);}
/* PHOTOS FADE DOWN harder than drawings: a real picture has detail right
   to the bottom edge, so the scrim starts higher and ends nearly black. A
   light top fade keeps the number and rest pill readable too. */
.wcard:has(.photo)::after{height:68%;
  background:linear-gradient(180deg, rgba(10,10,12,0) 0%, rgba(10,10,12,.55) 38%, rgba(10,10,12,.9) 72%, rgba(10,10,12,.97) 100%);}
.wcard:has(.photo)::before{content:''; position:absolute; left:0; right:0; top:0; height:26%; z-index:1; pointer-events:none;
  background:linear-gradient(180deg, rgba(10,10,12,.55), rgba(10,10,12,0));}
.wc-in{position:absolute; inset:0; z-index:2; pointer-events:none; display:flex; flex-direction:column; justify-content:space-between;
  padding:16px max(16px, env(safe-area-inset-right, 0px)) 18px max(16px, env(safe-area-inset-left, 0px));}
.wc-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.wc-badge{width:36px; height:36px; border-radius:10px; display:grid; place-items:center; background:rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.14);
  font-family:var(--display-face); font-weight:700; font-size:16px; color:var(--gold-bright); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);}
.wc-badge.ok{color:var(--c-easy); border-color:rgba(132,165,110,.5);}
.wc-badge.ok svg.i{width:18px; height:18px; stroke-width:2.8;}
.wc-name{font-weight:600; font-size:clamp(26px, 8vw, 34px); line-height:1.02; letter-spacing:.03em; text-transform:uppercase; color:#fff;
  text-shadow:0 0 1px rgba(255,255,255,.42), 0 0 13px rgba(255,255,255,.22); text-wrap:balance;}
.wc-pat{font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:rgba(244,241,234,.75); margin-top:4px;}
.wc-bot{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-top:12px;}
.wc-rx{font-family:var(--mono-face); font-size:16px; font-weight:600; letter-spacing:.02em; color:#fff;}
.wc-rx small{display:block; font-family:var(--text-face); font-weight:400; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:rgba(244,241,234,.65);}
.wc-in{justify-content:flex-start;}
.wc-in > :nth-child(2){margin-top:auto;}
.pill{font-weight:600; font-size:12px; letter-spacing:.06em; text-transform:uppercase; white-space:nowrap; border:1px solid var(--bronze); color:var(--gold);
  border-radius:999px; padding:4px 10px; font-variant-numeric:tabular-nums; background:rgba(0,0,0,.45); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);}
.pill.ok{border-color:rgba(132,165,110,.6); color:var(--c-easy);}
.pill.quiet{border-color:rgba(255,255,255,.22); color:var(--ink-dim);}
.pill.now{border-color:var(--cherry); color:#fff; background:rgba(122,46,66,.55);}
.pager{display:flex; justify-content:center; margin-top:10px;}
.pager .dots{padding:4px 0;}

/* ---------- WHAT THE FRONT CARD HOLDS ---------- */
.panel{padding:18px 2px 0; display:flex; flex-direction:column; gap:12px; animation:fade .22s ease;}
.panel-h{display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
.panel-h b{font-weight:600; font-size:19px; letter-spacing:.03em; text-transform:uppercase;}
.panel-h span{font-size:13px; color:var(--ink-faint); letter-spacing:.06em; text-transform:uppercase; white-space:nowrap;}
.cue{margin:0; font-size:15px; color:var(--ink-dim); border-left:2px solid var(--bronze); padding-left:10px;}
.last{display:flex; flex-direction:column; gap:4px; font-size:13.5px; color:var(--ink-faint);}
.last b{color:var(--ink); font-weight:500; font-family:var(--mono-face); font-size:13px;}
.last .up{color:var(--gold);}
.sets{display:flex; flex-direction:column; gap:8px;}
.set-row, .set-labels{display:grid; grid-template-columns:28px minmax(0,1fr) 14px minmax(0,1fr) 44px; align-items:center; gap:8px;}
.set-labels{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint);}
.set-labels span:nth-child(2), .set-labels span:nth-child(4){padding-left:4px;}
.set-n{font-family:var(--mono-face); font-size:14px; color:var(--ink-faint); text-align:center;}
.x{color:var(--ink-faint); text-align:center;}
.fld{display:flex; align-items:center; background:var(--bg); border:1px solid var(--line); border-radius:var(--radius-sm); padding:0 10px; height:44px; gap:6px; min-width:0;}
.fld input{width:100%; min-width:0; background:none; border:0; color:var(--ink); font-family:var(--mono-face); font-size:17px; font-weight:500; padding:0; outline:none; font-variant-numeric:tabular-nums;}
.fld span{font-size:12px; color:var(--ink-faint); letter-spacing:.04em;}
.fld:focus-within{border-color:var(--bronze);}
.tick{width:44px; height:44px; border-radius:50%; border:1.5px solid var(--line); display:grid; place-items:center; color:var(--ink-faint); transition:background .15s, border-color .15s, color .15s;}
.tick svg.i{width:20px; height:20px; stroke-width:2.6;}
.set-row.done .tick{background:var(--cherry-fill); border-color:var(--cherry); color:#fff; box-shadow:0 0 14px rgba(154,84,108,.45);}
.set-row.done .fld{border-color:var(--line-soft); background:var(--bg-2);}
.tick:active{transform:scale(.94);}

/* ---------- BUTTONS ---------- */
.cta-wrap{margin-top:28px; display:flex; flex-direction:column; align-items:center; gap:12px;}
.btn{width:100%; min-height:56px; border-radius:var(--radius); display:flex; align-items:center; justify-content:center; gap:10px; font-weight:600; font-size:20px; letter-spacing:.03em;}
/* RACE-DAY EDGE (Valhalla .view-plan > .race-event): lit, not filled. */
.btn-race{background:var(--cherry-tint), var(--t-tile); border:1.5px solid var(--cherry); color:#FFFFFF;
  box-shadow:0 0 16px var(--cherry-dim), inset 0 0 18px var(--cherry-tint);
  text-shadow:0 0 1px rgba(255,255,255,.50), 0 0 18px rgba(255,255,255,.30);}
.btn-race .mono{font-family:var(--mono-face); font-size:15px; font-weight:500; opacity:.85;}
.btn.ghost{border:1px solid var(--line); color:var(--gold); background:var(--bg-2); font-size:17px; min-height:48px;}
.link{font-size:14px; color:var(--ink-faint); letter-spacing:.04em; text-decoration:underline; text-underline-offset:3px;}
.btn:active{transform:scale(.985);}

/* ---------- GENERIC ---------- */
.kv{display:flex; flex-direction:column; gap:6px; font-size:15px; color:var(--ink-dim);}
.kv-row{display:flex; justify-content:space-between; gap:12px; border-top:1px solid var(--line-soft); padding-top:8px;}
.kv-row:first-child{border-top:0; padding-top:0;}
.kv-row b{color:var(--ink); font-weight:500; text-align:right;}
.kv-row .m{font-family:var(--mono-face); font-size:14px;}
.note{font-size:14px; color:var(--ink-faint); text-align:center; margin:16px 8px 0; text-wrap:balance;}
.body-text{margin:0; font-size:15px; color:var(--ink-dim);}
.stats{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px; margin-bottom:6px;}
.stat{background:var(--bg-2); border:1px solid var(--line-soft); border-radius:var(--radius); padding:12px 10px; text-align:center;}
.stat b{display:block; font-family:var(--mono-face); font-size:22px; font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums;}
.stat span{font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint);}
.bests{display:flex; flex-direction:column; background:var(--bg-2); border:1px solid var(--line-soft); border-radius:var(--radius);}
.best{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 12px; padding:12px 14px; border-top:1px solid var(--line-soft);}
.best:first-child{border-top:0;}
.best .n{font-weight:500; text-transform:uppercase; letter-spacing:.03em; font-size:15px;}
.best .w{font-family:var(--mono-face); font-size:14px; text-align:right;}
.best .s{grid-column:1 / -1; font-size:12.5px; color:var(--ink-faint);}
.group{background:var(--bg-2); border:1px solid var(--line-soft); border-radius:var(--radius); margin-bottom:20px;}
.group-title{font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); margin:0 6px 8px;}
.row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 16px; border-top:1px solid var(--line-soft); min-height:56px;}
.row:first-child{border-top:0;}
.row .lbl{display:flex; flex-direction:column; gap:2px; min-width:0;}
.row .lbl small{font-size:13px; color:var(--ink-faint);}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:999px; padding:3px; background:var(--bg);}
.seg button{padding:6px 14px; border-radius:999px; font-size:14px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-dim);}
.seg button[aria-pressed="true"]{background:var(--cherry-fill); color:#fff;}
.switch{width:50px; height:30px; border-radius:999px; background:var(--bg-4); border:1px solid var(--line); position:relative; flex:none; transition:background .2s;}
.switch::after{content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:var(--ink-faint); transition:transform .2s, background .2s;}
.switch[aria-checked="true"]{background:var(--cherry-fill); border-color:var(--cherry);}
.switch[aria-checked="true"]::after{transform:translateX(20px); background:#fff;}
.row .act{color:var(--cherry-text); font-size:15px; letter-spacing:.03em;}
.confirm{display:flex; gap:8px;}
.confirm button{padding:8px 12px; border-radius:var(--radius-sm); border:1px solid var(--line); font-size:14px;}
.confirm .yes{background:var(--cherry-fill); border-color:var(--cherry); color:#fff;}
.empty{border:1px dashed var(--line); border-radius:var(--tile-radius); padding:22px 18px; text-align:center; display:flex; flex-direction:column; gap:14px; align-items:center;}
.empty h3{margin:0; font-size:22px; font-weight:600; text-transform:uppercase; letter-spacing:.03em; color:var(--gold);}

/* ---------- REST BAR ---------- */
.rest{position:fixed; left:0; right:0; z-index:30; bottom:calc(64px + env(safe-area-inset-bottom, 0px));
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));}
.rest-in{max-width:448px; margin:0 auto; background:linear-gradient(180deg, var(--bg-4), var(--bg-2)); border:1.5px solid var(--cherry);
  border-radius:var(--tile-radius); padding:12px 14px 14px; box-shadow:0 0 16px var(--cherry-dim), 0 -8px 30px rgba(0,0,0,.6); display:flex; flex-direction:column; gap:10px;}
.rest-top{display:flex; align-items:center; justify-content:space-between; gap:12px;}
.rest-l{display:flex; flex-direction:column; min-width:0;}
.rest-l small{font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--cherry-text);}
.rest-l span{font-size:14px; color:var(--ink-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.rest-time{font-family:var(--mono-face); font-size:34px; font-weight:600; font-variant-numeric:tabular-nums; line-height:1;}
.rest-bar{height:4px; border-radius:2px; background:var(--cherry-tint); overflow:hidden;}
.rest-bar i{display:block; height:100%; background:linear-gradient(90deg, var(--cherry), var(--cherry-text)); transition:width .25s linear;}
.rest-btns{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
.rest-btns button{min-height:40px; border-radius:var(--radius-sm); border:1px solid var(--line); font-size:14px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-dim); background:var(--bg);}
.rest.over .rest-in{border-color:var(--gold);}
.rest.over .rest-l small{color:var(--gold);}

/* ---------- BOTTOM NAV (Valhalla's) ---------- */
.bottom-nav{position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--bg);
  padding:6px max(4px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(4px, env(safe-area-inset-left, 0px));}
.bottom-nav .in{max-width:480px; margin:0 auto; display:flex;}
.bn-item{flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; min-width:0; padding:7px 1px;
  font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:#fff;
  text-shadow:0 0 1px rgba(255,255,255,.55), 0 0 9px rgba(255,255,255,.26);}
.bn-item svg.i{width:20px; height:20px; filter:drop-shadow(0 0 5px rgba(255,255,255,.30));}
.bn-item span{max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.bn-item.active{color:var(--gold-bright);
  text-shadow:0 0 1.1px rgba(245,208,97,.85), 0 0 6.6px rgba(227,177,90,.78), 0 0 16.5px rgba(227,177,90,.42), 0 0 30.8px rgba(227,177,90,.15);}
.bn-item.active svg.i{stroke-width:2.3; filter:drop-shadow(0 0 4.4px rgba(245,208,97,.70)) drop-shadow(0 0 15.4px rgba(227,177,90,.45));}
.bn-item:active{transform:scale(.95);}

/* ---------- SUMMARY SHEET ---------- */
.sheet-back{position:fixed; inset:0; z-index:50; background:rgba(8,8,10,.72); display:flex; align-items:flex-end; justify-content:center;
  padding:0 max(12px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));}
.sheet{width:100%; max-width:460px; background:linear-gradient(180deg, var(--bg-4), var(--bg-2)); border:1px solid var(--bronze); border-radius:24px;
  padding:22px 18px 18px; display:flex; flex-direction:column; gap:16px; box-shadow:0 0 40px rgba(227,177,90,.18); animation:rise .32s cubic-bezier(.2,.8,.2,1);}
.sheet h2{margin:0; text-align:center; font-family:var(--display-face); color:var(--gold); font-size:24px; letter-spacing:.05em;}
.sheet .sub{text-align:center; color:var(--ink-dim); margin-top:-8px;}
.sheet .section-head{margin:0;}
.pr{display:flex; justify-content:space-between; gap:10px; font-size:15px; padding:8px 12px; border-radius:var(--radius-sm); background:var(--bg); border:1px solid var(--line-soft);}
.pr b{color:var(--gold); font-weight:500;}
@keyframes rise{from{transform:translateY(24px); opacity:0;} to{transform:none; opacity:1;}}
.view{animation:fade .18s ease;}
@keyframes fade{from{opacity:0;} to{opacity:1;}}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important; animation:none !important;}
  .th-arc path{stroke-dasharray:none;}
}
@media (max-width:370px){ .pill{font-size:10.5px; padding:3px 8px;} }
</style>

if (!state || state.v !== 2) state = defaults();
state.idx = state.idx || {};
var ui = {confirm:null, sheet:null, rest:null, tile:0};
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }

/* ================= HELPERS ================= */
function unit(){ return state.units; }
function fmtW(kg){ return state.units === 'lb' ? String(Math.round(kg*2.20462)) : String(Math.round(kg*100)/100); }
function toKg(v){ var n = parseFloat(String(v).replace(',', '.')); if (isNaN(n)) return null; return state.units==='lb' ? n/2.20462 : n; }
function wLabel(ex, kg){ return ex.bw ? (kg > 0 ? 'BW+'+fmtW(kg)+' '+unit() : 'BW') : fmtW(kg)+' '+unit(); }
function mmss(sec){ sec = Math.max(0, Math.round(sec)); var m = Math.floor(sec/60), s = sec%60; return m+':'+(s<10?'0':'')+s; }
function setsFor(ex){ return state.week === BLOCK_WEEKS ? Math.ceil(ex.sets/2) : ex.sets; }
function dateStr(t){ return new Date(t).toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'}); }
function lastFor(exId){ for (var i=state.history.length-1;i>=0;i--){ var h=state.history[i]; if (h.sets[exId] && h.sets[exId].length) return h.sets[exId]; } return null; }
function topW(sets){ return sets.reduce(function(m,s){return Math.max(m,s.w);}, 0); }
function suggest(ex){
  var last = lastFor(ex.id);
  if (!last) return {w:ex.start, up:false};
  var w = topW(last), allTop = last.length >= setsFor(ex) && last.every(function(s){return s.r >= ex.hi;});
  if (allTop && state.week !== BLOCK_WEEKS) return {w:w+(ex.inc||2.5), up:true};
  return {w:w, up:false};
}
function e1rm(w, r){ return w*(1+r/30); }
function score(ex, s){ return ex.bw ? s.w*100 + s.r : e1rm(s.w, s.r); }
function doneThisWeek(){ return state.history.filter(function(h){return h.week===state.week;}).map(function(h){return h.sid;}); }
function todaySid(){
  var done = doneThisWeek();
  if (state.override && done.indexOf(state.override) < 0) return state.override;
  for (var i=0;i<ORDER.length;i++) if (done.indexOf(ORDER[i]) < 0) return ORDER[i];
  return null;
}
function ensureActive(sid){
  var a = state.active;
  if (a && a.sid === sid) return a;
  var s = SESSIONS[sid], sets = {};
  s.exercises.forEach(function(ex){
    var sg = suggest(ex), last = lastFor(ex.id) || [];
    sets[ex.id] = [];
    for (var i=0;i<setsFor(ex);i++) sets[ex.id].push({w:sg.w, r: sg.up ? ex.lo : (last[i] ? last[i].r : ex.lo), done:false});
  });
  state.active = {sid:sid, startedAt:null, idx:0, sets:sets};
  save(); return state.active;
}
function exComplete(a, ex){ return a.sets[ex.id].every(function(s){return s.done;}); }
function firstIncompleteIdx(a){
  var ex = SESSIONS[a.sid].exercises;
  for (var i=0;i<ex.length;i++) if (!exComplete(a, ex[i])) return i;
  return -1;
}
function counts(a){ var t=0, d=0; for (var k in a.sets) a.sets[k].forEach(function(s){ t++; if (s.done) d++; }); return {total:t, done:d}; }
function volume(sets){ var v=0; for (var k in sets) sets[k].forEach(function(s){ v += s.w*s.r; }); return v; }
function fmtVol(kg){ var v = state.units==='lb' ? kg*2.20462 : kg; return v >= 10000 ? (Math.round(v/100)/10)+'k' : String(Math.round(v)); }

/* ================= THE WALLET DECK =================
   One component for every screen. A deck has a key, a list of cards, an
   index, and a detail function that renders what the front card holds. */
var DETAIL = {};
function getIdx(key){ return key === 'today' ? (state.active ? state.active.idx || 0 : 0) : (state.idx[key] || 0); }
function setIdx(key, i){ if (key === 'today'){ if (state.active) state.active.idx = i; } else state.idx[key] = i; save(); }
function deck(key, cards, idx){
  return '<div class="deck" data-deck="'+key+'" role="group" aria-roledescription="carousel">'+
    '<div class="deck-track" style="transform:translateX('+(-idx*100)+'%)">'+
    cards.map(function(c, i){
      return '<div class="wcard '+(c.cls||'')+'" data-di="'+i+'" role="group" aria-roledescription="slide" aria-label="'+(i+1)+' of '+cards.length+'" aria-hidden="'+(i!==idx)+'">'+c.html+'</div>';
    }).join('')+'</div></div>'+pager(key, cards.length, idx)+
    '<div class="detail" id="detail-'+key+'">'+(DETAIL[key] ? DETAIL[key](idx) : '')+'</div>';
}
function pager(key, n, idx){
  var dots = ''; for (var i=0;i<n;i++) dots += '<button type="button" class="'+(i===idx?'on':'')+'" data-action="deck-go" data-deck="'+key+'" data-i="'+i+'" aria-label="Show '+(i+1)+' of '+n+'"'+(i===idx?' aria-current="true"':'')+'></button>';
  return '<div class="pager" data-pager="'+key+'"><div class="dots">'+dots+'</div></div>';
}
function goDeck(key, i){
  var el = document.querySelector('[data-deck="'+key+'"]'); if (!el) return;
  var track = el.querySelector('.deck-track'), cards = el.querySelectorAll('.wcard'), n = cards.length;
  i = Math.max(0, Math.min(n-1, i));
  setIdx(key, i);
  track.classList.remove('dragging'); track.style.transform = 'translateX('+(-i*100)+'%)';
  cards.forEach(function(c, j){ c.setAttribute('aria-hidden', j!==i); });
  var pg = document.querySelector('[data-pager="'+key+'"]'); if (pg) pg.outerHTML = pager(key, n, i);
  var dt = document.getElementById('detail-'+key); if (dt && DETAIL[key]) dt.innerHTML = DETAIL[key](i);
}

/* ================= TODAY ================= */
function brand(){ return '<header class="brand"><div class="wordmark">VELVET VIKING</div><div class="rule"></div></header>'; }
function screenHead(title, sub, chip){
  return '<div class="screen-head"><div><div class="screen-title">'+title+'</div><div class="screen-sub">'+sub+'</div></div>'+(chip?'<span class="chip">'+chip+'</span>':'')+'</div>';
}
/* 280 degrees, clockwise, gap centred at the top right (from 7.5° to 87.5°
   measured clockwise from 12 o'clock), on Valhalla's r=45 circle. */
var TH_ARC = '<svg class="th-arc" viewBox="0 0 100 100" aria-hidden="true">'+
  '<path pathLength="1" d="M94.96 48.04 A 45 45 0 1 1 55.87 5.38" fill="none" stroke="url(#th-grad)" stroke-width="8.5" stroke-linecap="round"/>'+
  '<defs><linearGradient id="th-grad" x1="0" y1="0" x2="0" y2="1">'+
  '<stop offset="0%" stop-color="#FFF1F5"/><stop offset="16%" stop-color="#C46A89"/><stop offset="52%" stop-color="#9A546C"/><stop offset="100%" stop-color="rgba(154,84,108,0.50)"/>'+
  '</linearGradient></defs></svg>';

function exCards(a){
  var cur = firstIncompleteIdx(a);
  return SESSIONS[a.sid].exercises.map(function(ex, i){
    var sets = a.sets[ex.id], n = sets.length, d = sets.filter(function(s){return s.done;}).length, complete = d === n;
    return {cls:'hue-'+(i%5)+(complete?' complete':'')+(a.startedAt && i===cur?' current':''),
      html: artFor(ex)+'<div class="wc-in"><div class="wc-top">'+
        (complete?'<span class="wc-badge ok">'+ICONS.check+'</span>':'<span class="wc-badge">'+(i+1)+'</span>')+
        '<span class="pill">Rest '+mmss(ex.rest)+'</span></div>'+
        '<div><div class="wc-name">'+ex.name+'</div><div class="wc-pat">'+ex.pattern+'</div></div>'+
        '<div class="wc-bot"><span class="wc-rx"><small>Sets × reps</small>'+n+' × '+ex.lo+'–'+ex.hi+'</span>'+(d?'<span class="pill '+(complete?'ok':'now')+'">'+d+'/'+n+' done</span>':'')+'</div></div>'};
  });
}
DETAIL.today = function(i){
  var a = state.active; if (!a) return '';
  var ex = SESSIONS[a.sid].exercises[i]; if (!ex) return '';
  var sets = a.sets[ex.id], last = lastFor(ex.id), sg = suggest(ex);
  var lastTxt = last ? '<span>Last time: <b>'+wLabel(ex, topW(last))+'</b> for <b>'+last.map(function(s){return s.r;}).join(', ')+'</b></span>' : '<span>First time: pick a weight you can lift for '+ex.hi+' clean reps.</span>';
  var upTxt = sg.up ? '<span class="up">You hit '+ex.hi+' on every set. Today adds '+fmtW(ex.inc||2.5)+' '+unit()+'.</span>' : '';
  var rows = sets.map(function(s, si){
    return '<div class="set-row'+(s.done?' done':'')+'"><span class="set-n">'+(si+1)+'</span>'+
      '<label class="fld"><input id="w-'+ex.id+'-'+si+'" inputmode="decimal" autocomplete="off" aria-label="Set '+(si+1)+' weight" data-set="'+ex.id+'|'+si+'|w" value="'+fmtW(s.w)+'"><span>'+(ex.bw?'+':'')+unit()+'</span></label>'+
      '<span class="x">×</span>'+
      '<label class="fld"><input id="r-'+ex.id+'-'+si+'" inputmode="numeric" autocomplete="off" aria-label="Set '+(si+1)+' reps" data-set="'+ex.id+'|'+si+'|r" value="'+s.r+'"><span>reps</span></label>'+
      '<button type="button" class="tick" data-action="tick" data-ex="'+ex.id+'" data-i="'+si+'" aria-pressed="'+s.done+'" aria-label="Mark set '+(si+1)+' done">'+ICONS.check+'</button></div>';
  }).join('');
  return '<div class="panel"><div class="panel-h"><b>'+ex.name+'</b><span>'+(i+1)+' of '+SESSIONS[a.sid].exercises.length+'</span></div>'+
    '<p class="cue">'+ex.cue+'</p><div class="last">'+lastTxt+upTxt+'</div>'+
    '<div class="sets"><div class="set-labels"><span>Set</span><span>'+(ex.bw?'Added':'Weight')+'</span><span></span><span>Reps</span><span></span></div>'+rows+'</div></div>';
};
function tiles(s){
  var mods = [['Focus', s.focus], ['Feel', s.feel], ['Watch for', s.watch]];
  return '<div class="tiles">'+mods.map(function(m, j){
    return '<button type="button" class="tile3'+(j===ui.tile?' is-active':'')+'" data-action="tile-go" data-i="'+j+'" aria-pressed="'+(j===ui.tile)+'"><span class="k">'+m[0]+'</span><span class="v">'+m[1]+'</span></button>';
  }).join('')+'</div>';
}

function viewToday(){
  var ph = phaseOf(state.week), sid = todaySid();
  if (!sid){
    var last = state.week >= BLOCK_WEEKS;
    return brand()+'<div class="empty"><h3>Week '+state.week+' complete</h3><p class="body-text">All four sessions are logged. Rest days are where the strength gets built.</p>'+
      '<button type="button" class="btn btn-race" data-action="next-week">'+(last?'Start a new block':'Start week '+(state.week+1))+ICONS.arrow+'</button></div>';
  }
  var s = SESSIONS[sid], a = ensureActive(sid), c = counts(a), started = !!a.startedAt;
  var cta = started
    ? '<button type="button" class="btn btn-race" data-action="finish">Finish session <span class="mono" id="elapsed">'+mmss((Date.now()-a.startedAt)/1000)+'</span></button><button type="button" class="link" data-action="discard">Discard this session</button>'
    : '<button type="button" class="btn btn-race" data-action="start">Start session '+ICONS.arrow+'</button>';
  return brand()+
    '<section class="th-hero"><div class="th-hero-main"><span class="th-hero-title">'+s.name+'</span>'+
      '<div class="th-dist"><span>'+(started ? c.done+'/'+c.total : c.total)+'</span><em>sets</em></div>'+
      '<span class="th-phase">Week '+state.week+' · '+ph.name+'</span></div>'+
      '<div class="th-ring-wrap"><div class="th-ring">'+TH_ARC+'<div class="th-ring-in">'+
        '<div class="th-row"><span class="th-ic">'+ICONS.clock+'</span>'+s.minutes+' min</div>'+
        '<div class="th-row"><span class="th-ic">'+ICONS.flame+'</span>'+s.effort+'</div>'+
        '<div class="th-row mp">'+s.exercises.length+' lifts</div></div></div></div></section>'+
    '<p class="th-steps-note">'+s.intro+'</p>'+
    tiles(s)+
    '<div class="section-head"><h2>Session</h2><span>'+s.exercises.length+' exercises</span></div>'+
    deck('today', exCards(a), a.idx || 0)+
    '<div class="cta-wrap">'+cta+'</div>';
}

/* ================= THIS WEEK ================= */
function weekDefault(){ var t = todaySid(); for (var i=0;i<WEEK.length;i++) if (WEEK[i].s === t) return i; return 0; }
DETAIL.week = function(i){
  var w = WEEK[i]; if (!w) return '';
  if (!w.s) return '<div class="panel"><div class="panel-h"><b>'+w.d+' · Rest</b></div><p class="body-text">No lifting today. A 30-minute walk and a good night\'s sleep do more for the next session than extra work.</p></div>';
  var s = SESSIONS[w.s], done = doneThisWeek().indexOf(w.s) >= 0, isToday = todaySid() === w.s;
  var list = s.exercises.map(function(ex){ return '<div class="kv-row"><span>'+ex.name+'</span><b class="m">'+setsFor(ex)+' × '+ex.lo+'–'+ex.hi+'</b></div>'; }).join('');
  var act = '';
  if (done){ var h = state.history.filter(function(x){return x.week===state.week && x.sid===w.s;}).pop(); act = '<p class="body-text">Logged '+dateStr(h.date)+' · '+fmtVol(volume(h.sets))+' '+unit()+' lifted.</p>'; }
  else if (!isToday) act = '<button type="button" class="btn ghost" data-action="do-today" data-sid="'+w.s+'">Do this session today</button>';
  else act = '<button type="button" class="btn ghost" data-action="view" data-view="today">Open in Today</button>';
  return '<div class="panel"><div class="panel-h"><b>'+s.name+'</b><span>'+s.minutes+' min · '+s.effort+'</span></div><div class="kv">'+list+'</div>'+act+'</div>';
};
function viewWeek(){
  var ph = phaseOf(state.week), done = doneThisWeek(), today = todaySid();
  if (state.idx.week === undefined) state.idx.week = weekDefault();
  var cards = WEEK.map(function(w){
    if (!w.s) return {cls:'hue-rest', html:bigArt('Z')+'<div class="wc-in"><div class="wc-top"><span class="wc-badge">'+w.d.charAt(0)+'</span><span class="pill quiet">Rest</span></div><div><div class="wc-name">'+w.d+'day<br>Rest</div><div class="wc-pat">Recovery</div></div><div class="wc-bot"><span class="wc-rx"><small>Plan</small>Walk · sleep</span></div></div>'};
    var s = SESSIONS[w.s], isDone = done.indexOf(w.s) >= 0, isToday = today === w.s;
    var pill = isDone ? '<span class="pill ok">Done</span>' : isToday ? '<span class="pill now">Today</span>' : '<span class="pill quiet">Planned</span>';
    return {cls:'hue-'+s.hue+(isToday?' current':'')+(isDone?' complete':''),
      html:artFor(s.exercises[0])+'<div class="wc-in"><div class="wc-top">'+(isDone?'<span class="wc-badge ok">'+ICONS.check+'</span>':'<span class="wc-badge">'+w.d.charAt(0)+'</span>')+pill+'</div>'+
        '<div><div class="wc-name">'+s.name+'</div><div class="wc-pat">'+w.d+' · '+s.area+'</div></div>'+
        '<div class="wc-bot"><span class="wc-rx"><small>Session</small>'+s.exercises.length+' lifts · '+s.minutes+'m</span></div></div>'};
  });
  return brand()+screenHead('This Week', 'Week '+state.week+' of '+BLOCK_WEEKS+' · '+ph.name, ICONS.calendarWeek+done.length+' of '+ORDER.length+' done')+
    deck('week', cards, state.idx.week)+
    '<p class="note">Sessions run in order. Missed one? Swipe to it and move it to today.</p>';
}

/* ================= PROGRAM ================= */
DETAIL.program = function(i){
  var w = i+1, ph = phaseOf(w);
  var split = ORDER.map(function(sid){ var s=SESSIONS[sid]; return '<div class="kv-row"><span>'+WEEK.filter(function(x){return x.s===sid;})[0].d+' · '+s.name+'</span><b class="m">'+(w===BLOCK_WEEKS?'½ sets':s.minutes+' min')+'</b></div>'; }).join('');
  return '<div class="panel"><div class="panel-h"><b>Week '+w+' · '+ph.name+'</b><span>'+(w<state.week?'Done':w===state.week?'This week':'Ahead')+'</span></div><p class="body-text">'+ph.text+'</p><div class="kv">'+split+'</div></div>';
};
function viewProgram(){
  if (state.idx.program === undefined) state.idx.program = state.week-1;
  var cards = [];
  for (var w=1; w<=BLOCK_WEEKS; w++){
    var ph = phaseOf(w), past = w < state.week, cur = w === state.week;
    cards.push({cls:'hue-'+ph.hue+(cur?' current':'')+(past?' complete':''),
      html:bigArt(String(w))+'<div class="wc-in"><div class="wc-top">'+(past?'<span class="wc-badge ok">'+ICONS.check+'</span>':'<span class="wc-badge">'+w+'</span>')+
        (past?'<span class="pill ok">Done</span>':cur?'<span class="pill now">Now</span>':'<span class="pill quiet">Ahead</span>')+'</div>'+
        '<div><div class="wc-name">Week '+w+'</div><div class="wc-pat">'+ph.name+'</div></div>'+
        '<div class="wc-bot"><span class="wc-rx"><small>Sessions</small>4 · '+(w===BLOCK_WEEKS?'half sets':'full sets')+'</span></div></div>'});
  }
  return brand()+screenHead('Program', 'Block 1 · '+BLOCK_WEEKS+' weeks · 4 days', ICONS.layers+'Strength')+
    deck('program', cards, state.idx.program)+
    '<div class="section-head"><h2>How it progresses</h2></div>'+
    '<div class="group"><div class="row"><span class="lbl">Hit the top of the rep range on every set<small>The next session adds 2.5 '+unit()+' (less on small lifts) and starts again at the bottom of the range.</small></span></div>'+
    '<div class="row"><span class="lbl">Fall short<small>Keep the weight and beat last time by a rep.</small></span></div>'+
    '<div class="row"><span class="lbl">Deload week<small>Half the sets, same weights, no load added.</small></span></div></div>';
}

/* ================= TRAINING ================= */
function sortedHistory(){ return state.history.slice().sort(function(a,b){return b.date-a.date;}); }
DETAIL.history = function(i){
  var h = sortedHistory()[i]; if (!h) return '';
  var rows = Object.keys(h.sets).map(function(k){ var ex = exById(k), ss = h.sets[k];
    return '<div class="kv-row"><span>'+ex.name+'</span><b class="m">'+wLabel(ex, topW(ss))+' · '+ss.map(function(x){return x.r;}).join(',')+'</b></div>'; }).join('');
  return '<div class="panel"><div class="panel-h"><b>'+SESSIONS[h.sid].name+'</b><span>'+dateStr(h.date)+' · '+h.mins+' min</span></div><div class="kv">'+rows+'</div></div>';
};
function viewTraining(){
  var hist = sortedHistory();
  var vol = state.history.filter(function(h){return h.week===state.week;}).reduce(function(v,h){return v+volume(h.sets);}, 0);
  var totalSets = state.history.reduce(function(n,h){ for (var k in h.sets) n += h.sets[k].length; return n; }, 0);
  var bests = {};
  state.history.forEach(function(h){ for (var k in h.sets) h.sets[k].forEach(function(s){
    var ex = exById(k); if (!ex) return; var sc = score(ex, s);
    if (!bests[k] || sc > bests[k].sc) bests[k] = {sc:sc, w:s.w, r:s.r, date:h.date};
  }); });
  var bestRows = Object.keys(bests).slice(0, 8).map(function(k){
    var ex = exById(k), b = bests[k];
    return '<div class="best"><span class="n">'+ex.name+'</span><span class="w">'+wLabel(ex, b.w)+' × '+b.r+'</span><span class="s">'+(ex.bw ? 'Best set' : 'Estimated 1-rep max '+fmtW(e1rm(b.w,b.r))+' '+unit())+' · '+dateStr(b.date)+'</span></div>';
  }).join('');
  var hasExample = state.history.some(function(h){return h.example;});
  var idx = Math.min(state.idx.history || 0, Math.max(0, hist.length-1));
  var cards = hist.map(function(h){
    var s = SESSIONS[h.sid], n = 0; for (var k in h.sets) n += h.sets[k].length;
    return {cls:'hue-'+s.hue, html:artFor(s.exercises[0])+'<div class="wc-in"><div class="wc-top"><span class="wc-badge">'+new Date(h.date).toLocaleDateString('en-GB',{weekday:'short'}).charAt(0)+'</span>'+
      (h.example?'<span class="pill quiet">Example</span>':'<span class="pill ok">Week '+h.week+'</span>')+'</div>'+
      '<div><div class="wc-name">'+s.name+'</div><div class="wc-pat">'+dateStr(h.date)+'</div></div>'+
      '<div class="wc-bot"><span class="wc-rx"><small>Lifted</small>'+fmtVol(volume(h.sets))+' '+unit()+' · '+n+' sets</span></div></div>'};
  });
  return brand()+screenHead('Training', 'What you have lifted', ICONS.target+'Block 1')+
    '<div class="stats"><div class="stat"><b>'+state.history.length+'</b><span>Sessions</span></div><div class="stat"><b>'+fmtVol(vol)+'</b><span>'+unit()+' this week</span></div><div class="stat"><b>'+totalSets+'</b><span>Sets</span></div></div>'+
    '<div class="section-head"><h2>History</h2><span>'+hist.length+' sessions</span></div>'+
    (hist.length ? deck('history', cards, idx) : '<div class="empty"><p class="body-text">Nothing logged yet. Finish a session on Today and it appears here.</p></div>')+
    (bestRows ? '<div class="section-head"><h2>Best sets</h2></div><div class="bests">'+bestRows+'</div>' : '')+
    (hasExample ? '<p class="note">Sessions marked Example are sample data so the app has numbers to show. Clear them in Settings.</p>' : '');
}

/* ================= SETTINGS ================= */
function viewSettings(){
  function sw(key, label, sub){ return '<div class="row"><span class="lbl">'+label+'<small>'+sub+'</small></span><button type="button" class="switch" role="switch" aria-checked="'+!!state[key]+'" aria-label="'+label+'" data-action="flip" data-key="'+key+'"></button></div>'; }
  function danger(key, label, sub){
    var act = ui.confirm === key ? '<span class="confirm"><button type="button" data-action="cancel">Cancel</button><button type="button" class="yes" data-action="do-'+key+'">Confirm</button></span>'
      : '<button type="button" class="act" data-action="ask" data-key="'+key+'">'+label+'</button>';
    return '<div class="row"><span class="lbl">'+label+'<small>'+sub+'</small></span>'+act+'</div>';
  }
  return brand()+screenHead('Settings', 'Make the app yours', null)+
    '<div class="group-title">Units</div><div class="group"><div class="row"><span class="lbl">Weight<small>Every screen updates.</small></span>'+
      '<span class="seg"><button type="button" data-action="units" data-u="kg" aria-pressed="'+(state.units==='kg')+'">kg</button><button type="button" data-action="units" data-u="lb" aria-pressed="'+(state.units==='lb')+'">lb</button></span></div></div>'+
    '<div class="group-title">Rest timer</div><div class="group">'+sw('autoRest','Start automatically','Ticking a set starts the rest for that exercise.')+sw('vibrate','Vibrate when rest ends','On phones that support it.')+sw('sound','Beep when rest ends','A short tone.')+'</div>'+
    '<div class="group-title">Data</div><div class="group">'+danger('examples','Clear examples','Remove the sample sessions. Your own sessions stay.')+danger('reset','Reset everything','Back to week 3 with sample data. Your logs are deleted.')+'</div>'+
    '<p class="note">Prototype. Data is saved on this device only.</p>';
}

/* ================= SHELL ================= */
function renderNav(){
  var items = [{key:'today',label:'Today',icon:ICONS.clock},{key:'week',label:'This Week',icon:ICONS.calendarWeek},{key:'program',label:'Program',icon:ICONS.layers},{key:'training',label:'Training',icon:ICONS.target},{key:'prefs',label:'Settings',icon:ICONS.settings}];
  document.getElementById('nav').innerHTML = '<div class="in">'+items.map(function(it){
    return '<button type="button" class="bn-item'+(state.view===it.key?' active':'')+'" data-action="view" data-view="'+it.key+'"'+(state.view===it.key?' aria-current="page"':'')+'>'+it.icon+'<span>'+it.label+'</span></button>';
  }).join('')+'</div>';
}
function render(){
  var v = state.view;
  var html = v==='week' ? viewWeek() : v==='program' ? viewProgram() : v==='training' ? viewTraining() : v==='prefs' ? viewSettings() : viewToday();
  document.getElementById('app').innerHTML = '<div class="view">'+html+'</div>';
  renderNav(); renderRest(); renderSheet();
}

/* ================= REST TIMER ================= */
function startRest(ex, label){ ui.rest = {end:Date.now()+ex.rest*1000, total:ex.rest, label:label, over:false}; renderRest(); }
function renderRest(){
  var m = document.getElementById('rest-mount'), app = document.getElementById('app');
  if (!ui.rest || state.view !== 'today'){ m.innerHTML=''; app.classList.remove('resting'); return; }
  app.classList.add('resting');
  var left = (ui.rest.end - Date.now())/1000, over = left <= 0, pct = Math.max(0, Math.min(1, left/ui.rest.total));
  m.innerHTML = '<div class="rest'+(over?' over':'')+'" role="timer"><div class="rest-in"><div class="rest-top"><div class="rest-l"><small>'+(over?'Rest over · go':'Rest')+'</small><span>'+ui.rest.label+'</span></div><div class="rest-time" id="rest-time">'+(over?'0:00':mmss(left))+'</div></div>'+
    '<div class="rest-bar"><i id="rest-fill" style="width:'+(pct*100)+'%"></i></div>'+
    '<div class="rest-btns"><button type="button" data-action="rest-add" data-s="-15">−15s</button><button type="button" data-action="rest-add" data-s="15">+15s</button><button type="button" data-action="rest-skip">'+(over?'Close':'Skip')+'</button></div></div></div>';
}
var audioCtx = null;
function beep(){ try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); var o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.frequency.value = 880; g.gain.value = .15; o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + .35); } catch(e){} }
setInterval(function(){
  var el = document.getElementById('elapsed');
  if (el && state.active && state.active.startedAt) el.textContent = mmss((Date.now()-state.active.startedAt)/1000);
  if (!ui.rest) return;
  var left = (ui.rest.end - Date.now())/1000;
  if (left <= 0 && !ui.rest.over){
    ui.rest.over = true;
    if (state.vibrate && navigator.vibrate){ try { navigator.vibrate([200,100,200]); } catch(e){} }
    if (state.sound) beep();
    renderRest();
    setTimeout(function(){ if (ui.rest && ui.rest.over){ ui.rest = null; renderRest(); } }, 6000);
    return;
  }
  var t = document.getElementById('rest-time'), f = document.getElementById('rest-fill');
  if (t && !ui.rest.over) t.textContent = mmss(left);
  if (f && !ui.rest.over) f.style.width = (Math.max(0, left/ui.rest.total)*100)+'%';
}, 250);

/* ================= SUMMARY SHEET ================= */
function renderSheet(){
  var m = document.getElementById('sheet-mount');
  if (!ui.sheet){ m.innerHTML=''; return; }
  var sh = ui.sheet;
  var prs = sh.prs.length ? sh.prs.map(function(p){ return '<div class="pr"><span>'+p.name+'</span><b>'+p.txt+'</b></div>'; }).join('') : '<p class="body-text" style="text-align:center">No new bests today. The work still counts.</p>';
  m.innerHTML = '<div class="sheet-back"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-h"><h2 id="sheet-h">Session logged</h2><div class="sub">'+sh.name+'</div>'+
    '<div class="stats" style="margin:0"><div class="stat"><b>'+sh.mins+'</b><span>Minutes</span></div><div class="stat"><b>'+sh.sets+'</b><span>Sets</span></div><div class="stat"><b>'+sh.vol+'</b><span>'+unit()+' lifted</span></div></div>'+
    '<div class="section-head"><h2>New bests</h2></div>'+prs+'<button type="button" class="btn btn-race" data-action="close-sheet">Done</button></div></div>';
}

/* ================= ACTIONS ================= */
function bestBefore(ex){ var b = 0; state.history.forEach(function(h){ (h.sets[ex.id]||[]).forEach(function(s){ b = Math.max(b, score(ex, s)); }); }); return b; }
function finish(){
  var a = state.active; if (!a) return;
  var s = SESSIONS[a.sid], sets = {}, n = 0, prs = [];
  s.exercises.forEach(function(ex){
    var done = a.sets[ex.id].filter(function(x){return x.done;}).map(function(x){return {w:x.w, r:x.r};});
    if (!done.length) return;
    var before = bestBefore(ex), top = null;
    done.forEach(function(x){ var sc = score(ex, x); if (sc > before && (!top || sc > top.sc)) top = {sc:sc, x:x}; });
    if (top) prs.push({name:ex.name, txt:wLabel(ex, top.x.w)+' × '+top.x.r});
    sets[ex.id] = done; n += done.length;
  });
  if (!n){ state.active = null; save(); render(); return; }
  var mins = Math.max(1, Math.round((Date.now()-(a.startedAt||Date.now()))/60000));
  state.history.push({id:'s'+Date.now(), sid:a.sid, week:state.week, date:Date.now(), mins:mins, sets:sets});
  ui.sheet = {name:s.name, mins:mins, sets:n, vol:fmtVol(volume(sets)), prs:prs};
  state.active = null; state.override = null; ui.rest = null; state.idx.history = 0; delete state.idx.week;
  save(); render();
}

var suppressClick = false;
document.addEventListener('click', function(e){
  if (suppressClick){ suppressClick = false; e.preventDefault(); return; }
  var b = e.target.closest('[data-action]'); if (!b) return;
  var act = b.getAttribute('data-action'), a = state.active;
  switch (act){
    case 'view': goView(b.getAttribute('data-view')); return;
    case 'deck-go': goDeck(b.getAttribute('data-deck'), +b.getAttribute('data-i')); return;
    case 'tile-go': ui.tile = +b.getAttribute('data-i'); document.querySelectorAll('.tile3').forEach(function(t, j){ t.classList.toggle('is-active', j===ui.tile); t.setAttribute('aria-pressed', j===ui.tile); }); return;
    case 'start': {
      a.startedAt = Date.now(); var fi = firstIncompleteIdx(a); save(); render();
      if (fi >= 0 && fi !== a.idx) requestAnimationFrame(function(){ goDeck('today', fi); });
      var dk2 = document.querySelector('[data-deck="today"]'); if (dk2) dk2.scrollIntoView({behavior:'smooth', block:'start'});
      return;
    }
    case 'tick': {
      var exId = b.getAttribute('data-ex'), i = +b.getAttribute('data-i'), ex = exById(exId), set = a.sets[exId][i], advance = -1;
      set.done = !set.done;
      if (set.done){
        if (!a.startedAt) a.startedAt = Date.now();
        var nextSet = a.sets[exId].findIndex(function(x){return !x.done;});
        if (nextSet < 0){
          advance = firstIncompleteIdx(a);
          var nx = advance >= 0 ? SESSIONS[a.sid].exercises[advance] : null;
          if (state.autoRest && nx) startRest(ex, 'Next: '+nx.name); else ui.rest = null;
        } else if (state.autoRest) startRest(ex, 'Next: '+ex.name+' · set '+(nextSet+1));
      }
      save();
      var y = window.scrollY; render(); window.scrollTo(0, y);
      if (advance >= 0 && advance !== a.idx){
        setTimeout(function(){ goDeck('today', advance); var d = document.querySelector('[data-deck="today"]'); if (d) d.scrollIntoView({behavior:'smooth', block:'start'}); }, 260);
      }
      return;
    }
    case 'finish': finish(); return;
    case 'discard': state.active = null; ui.rest = null; save(); render(); return;
    case 'close-sheet': ui.sheet = null; render(); window.scrollTo(0,0); return;
    case 'next-week': state.week = state.week >= BLOCK_WEEKS ? 1 : state.week+1; state.active = null; delete state.idx.week; delete state.idx.program; save(); render(); return;
    case 'do-today': state.override = b.getAttribute('data-sid'); state.active = null; save(); goView('today'); return;
    case 'rest-add': if (ui.rest){ ui.rest.end += (+b.getAttribute('data-s'))*1000; ui.rest.total = Math.max(ui.rest.total, (ui.rest.end-Date.now())/1000); ui.rest.over = false; renderRest(); } return;
    case 'rest-skip': ui.rest = null; renderRest(); return;
    case 'units': state.units = b.getAttribute('data-u'); save(); render(); return;
    case 'flip': { var key = b.getAttribute('data-key'); state[key] = !state[key]; if (key==='sound' && state.sound) beep(); save(); render(); return; }
    case 'ask': ui.confirm = b.getAttribute('data-key'); render(); return;
    case 'cancel': ui.confirm = null; render(); return;
    case 'do-examples': state.history = state.history.filter(function(h){return !h.example;}); state.active = null; state.idx = {}; ui.confirm = null; save(); render(); return;
    case 'do-reset': state = defaults(); ui = {confirm:null, sheet:null, rest:null, tile:0}; save(); render(); return;
  }
});

/* SWIPE. Two gestures share one finger. On a carousel it moves the slides.
   Anywhere else on the page it moves between the five screens, in nav order,
   the way Valhalla's view pager does: the screen follows the finger, and past
   a third of the way (or a quick flick) the next screen slides in. */
var VIEWS = ['today','week','program','training','prefs'];
function goView(v, dir){
  if (v === state.view) { window.scrollTo(0,0); return; }
  var from = VIEWS.indexOf(state.view), to = VIEWS.indexOf(v);
  dir = dir || (to > from ? 1 : -1);
  state.view = v; ui.confirm = null; save(); render(); window.scrollTo(0,0);
  var el = document.querySelector('#app > .view');
  if (!el || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  el.style.transition = 'none'; el.style.transform = 'translateX('+(dir*36)+'%)'; el.style.opacity = '0';
  el.offsetWidth; // commit the start position before animating
  el.style.transition = 'transform .32s cubic-bezier(.22,.61,.36,1), opacity .26s ease';
  el.style.transform = ''; el.style.opacity = '';
}
var drag = null;
document.addEventListener('pointerdown', function(e){
  if (e.button !== undefined && e.button !== 0) return;
  if (!e.target.closest('#app') || e.target.closest('input') || document.querySelector('.sheet-back')) return;
  var dk = e.target.closest('.deck');
  drag = {deck:dk, x:e.clientX, y:e.clientY, t:Date.now(), dx:0, active:false,
    track: dk ? dk.querySelector('.deck-track') : null, page: dk ? null : document.querySelector('#app > .view')};
});
document.addEventListener('pointermove', function(e){
  if (!drag) return;
  var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.active){ if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)*1.3) drag.active = true; else if (Math.abs(dy) > 10){ drag = null; return; } else return; }
  drag.dx = dx;
  if (drag.track){
    var key = drag.deck.getAttribute('data-deck'), i = getIdx(key), n = drag.track.children.length;
    if ((i === 0 && dx > 0) || (i === n-1 && dx < 0)) dx = dx / 3;
    drag.track.classList.add('dragging'); drag.track.style.transform = 'translateX(calc('+(-i*100)+'% + '+dx+'px))';
  } else if (drag.page){
    var vi = VIEWS.indexOf(state.view);
    if ((vi === 0 && dx > 0) || (vi === VIEWS.length-1 && dx < 0)) dx = dx / 4;
    drag.page.style.transition = 'none'; drag.page.style.transform = 'translateX('+dx+'px)'; drag.page.style.opacity = String(1 - Math.min(.5, Math.abs(dx)/window.innerWidth));
  }
});
function endDrag(){
  if (!drag) return;
  var d = drag; drag = null;
  if (!d.active) return;
  suppressClick = true; setTimeout(function(){ suppressClick = false; }, 0);
  var fast = Math.abs(d.dx) / Math.max(1, Date.now()-d.t) > 0.5 && Math.abs(d.dx) > 40;
  if (d.track){
    var key = d.deck.getAttribute('data-deck'), i = getIdx(key);
    goDeck(key, d.dx < -50 ? i+1 : d.dx > 50 ? i-1 : i);
  } else if (d.page){
    var vi = VIEWS.indexOf(state.view), far = Math.abs(d.dx) > window.innerWidth/3 || fast;
    var next = far ? vi + (d.dx < 0 ? 1 : -1) : vi;
    if (next !== vi && next >= 0 && next < VIEWS.length){ goView(VIEWS[next], d.dx < 0 ? 1 : -1); }
    else { d.page.style.transition = 'transform .25s ease, opacity .25s ease'; d.page.style.transform = ''; d.page.style.opacity = ''; }
  }
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', function(){
  if (drag && drag.deck) goDeck(drag.deck.getAttribute('data-deck'), getIdx(drag.deck.getAttribute('data-deck')));
  if (drag && drag.page){ drag.page.style.transform = ''; drag.page.style.opacity = ''; }
  drag = null;
});

document.addEventListener('change', function(e){
  var t = e.target, spec = t.getAttribute && t.getAttribute('data-set'); if (!spec || !state.active) return;
  var p = spec.split('|'), set = state.active.sets[p[0]] && state.active.sets[p[0]][+p[1]]; if (!set) return;
  if (p[2] === 'w'){ var kg = toKg(t.value); if (kg !== null && kg >= 0) set.w = kg; t.value = fmtW(set.w); }
  else { var r = parseInt(t.value, 10); if (!isNaN(r) && r >= 0 && r < 200) set.r = r; t.value = set.r; }
  save();
});
document.addEventListener('focusin', function(e){ if (e.target.matches && e.target.matches('.fld input')) e.target.select(); });

render();
})();
</script>
</body>
